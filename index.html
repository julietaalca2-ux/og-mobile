<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ÖG</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- CSS Modularizado ÖG -->
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/feed.css">
    <link rel="stylesheet" href="css/stories.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/modals.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="appSplashScreen">
        <div class="splash-logo-container">
            <div class="splash-logo">Ög.</div>
        </div>
    </div>

    <!-- Auth Welcome Overlay -->
    <div id="authWelcomeOverlay" style="display: none;">
        <div class="auth-brand-container">
            <div class="auth-logo">Ög.</div>
            <div class="auth-tagline">Comparte tu mundo</div>
        </div>
        <div class="auth-forms-container">
            <div class="auth-panel active" id="loginPanel">
                <button onclick="executeSignIn()" style="width:100%; padding:12px; background:#3b82f6; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Iniciar Sesión</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-left">
            <div class="icon" onclick="openCameraModal()">📷</div>
        </div>
        <div class="header-center">Ög.</div>
        <div class="header-right">
            <div class="icon" onclick="openMenuSection()">☰<div class="header-notif-badge" id="headerNotifBadge"></div></div>
        </div>
    </header>

    <!-- Main Container -->
    <main>
        <!-- Feed Tab -->
        <div id="feedTab" style="display: block;">
            <div class="stories" id="storiesContainer"></div>
            <div id="postsFeedContainer"></div>
        </div>

        <!-- Explore Tab -->
        <div id="exploreTab" style="display: none;">
            <div class="explore-top-bar">
                <input type="text" class="explore-search-input" placeholder="Buscar..." oninput="searchUsers(this.value)">
            </div>
            <div class="explore-grid" id="exploreGridContainer"></div>
        </div>

        <!-- Chat Tab -->
        <div id="chatTab" style="display: none;">
            <div id="conversationsListContainer"></div>
        </div>

        <!-- Profile Tab -->
        <div id="profileTab" style="display: none;">
            <div id="myProfileView">
                <div class="ig-cover"></div>
                <div class="ig-profile-header">
                    <div style="font-size: 18px; font-weight: bold;" id="myProfileUsername">Mi Perfil</div>
                    <div class="ig-stats">
                        <div>
                            <div class="ig-stat-num" id="myPostsCount">0</div>
                            <div class="ig-stat-label">publicaciones</div>
                        </div>
                    </div>
                </div>
                <div class="ig-posts-grid" id="myPostsGrid"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav>
        <button class="active" onclick="showTab('feedTab', this)">🏠</button>
        <button onclick="showTab('exploreTab', this)">🔍</button>
        <button onclick="showTab('chatTab', this)">💬<div class="nav-msg-badge" id="navMsgBadge"></div></button>
        <button onclick="showTab('profileTab', this)">
            <div class="nav-avatar-ring"></div>
        </button>
    </nav>

    <!-- Modals & SubViews -->
    <div id="cameraModal"></div>
    <div id="storyViewer"></div>
    <div id="postDetailModal"></div>
    <div id="editProfileModal"></div>
    <div id="menuSectionPage"></div>

    <!-- Supabase SDK & Main Entry Point -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
