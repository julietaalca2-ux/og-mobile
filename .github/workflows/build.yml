name: Generar APK Web (React + Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias y compilar Web (Vite)
        run: |
          npm install
          npm run build

      - name: Configurar Capacitor y crear proyecto Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MiApp" "com.miapp.web" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo
        uses: actions/upload-artifact@v4
        with:
          name: app-web-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
