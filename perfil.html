
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<title>Ög — Mi perfil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090f;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:20px;border-bottom:1px solid #292933}
.logo{font-size:25px;font-weight:800}
main{max-width:650px;margin:auto;padding:15px 15px 110px}
.cover{height:155px;background:#201a30;border-radius:15px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.top{display:flex;align-items:flex-end;gap:14px;margin-top:-38px;padding:0 12px}
.avatar{width:92px;height:92px;border:4px solid #09090f;border-radius:50%;object-fit:cover;background:#292432}
.details{padding:12px 5px}
.name{font-size:21px;font-weight:800}
.username{color:#aaa;font-size:14px;margin-top:4px}
.bio{font-size:14px;color:#ddd;margin-top:12px;line-height:1.5}
.stats{display:flex;gap:25px;margin-top:18px;padding:14px 0;border-top:1px solid #292933;border-bottom:1px solid #292933}
.stat{text-align:center;font-size:13px;color:#aaa}
.stat strong{display:block;color:white;font-size:17px;margin-bottom:3px}
.actions{display:flex;gap:10px;margin:16px 0}
button{border:0;border-radius:11px;background:#8060d8;color:white;padding:12px 16px;font-weight:700;cursor:pointer}
.secondary{background:#22212b;color:white}
#editPanel{display:none;background:#17171f;border:1px solid #30303a;border-radius:14px;padding:15px;margin-top:15px}
input,textarea{width:100%;background:#101017;color:white;border:1px solid #383744;border-radius:10px;padding:12px;margin:7px 0;font:14px inherit}
textarea{min-height:80px;resize:vertical}
label{font-size:12px;color:#aaa;display:block;margin-top:10px}
#status{color:#c3a8ff;font-size:13px;margin:12px 0}
.postsTitle{font-weight:800;margin:24px 0 14px}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.post{aspect-ratio:1;background:#191720;overflow:hidden}
.post img{width:100%;height:100%;object-fit:cover}
.postText{padding:8px;font-size:12px;overflow:hidden}
.empty{color:#999;text-align:center;padding:25px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#101017;border-top:1px solid #292933;display:flex;justify-content:space-around;padding:13px 5px calc(13px + env(safe-area-inset-bottom));z-index:10}
nav a{color:#aaa;text-decoration:none;font-size:12px;text-align:center}
nav a.active{color:white}
nav span{display:block;font-size:21px;margin-bottom:4px}
</style>
</head>
<body>
<header><div class="logo">Ög</div></header>

<main>
<div class="cover"><img id="cover" alt="Portada" style="display:none"></div>

<div class="top">
<img id="avatar" class="avatar" alt="Foto de perfil">
<div class="details">
<div class="name" id="name">Cargando...</div>
<div class="username" id="username"></div>
</div>
</div>

<div class="bio" id="bio"></div>

<div class="stats">
<div class="stat"><strong id="postCount">0</strong>Publicaciones</div>
<div class="stat"><strong id="followers">0</strong>Seguidores</div>
<div class="stat"><strong id="following">0</strong>Seguidos</div>
</div>

<div class="actions">
<button id="editButton">Editar perfil</button>
<button class="secondary" id="logoutButton">Cerrar sesión</button>
</div>

<div id="editPanel">
<h3>Editar perfil</h3>
<label>Nombre</label>
<input id="editName" placeholder="Tu nombre">
<label>Nombre de usuario</label>
<input id="editUsername" placeholder="Tu usuario">
<label>Descripción</label>
<textarea id="editBio" placeholder="Contanos algo sobre vos"></textarea>
<label>Foto de perfil</label>
<input id="editAvatar" type="file" accept="image/*">
<label>Foto de portada</label>
<input id="editCover" type="file" accept="image/*">
<button id="saveButton">Guardar cambios</button>
<button class="secondary" id="cancelButton">Cancelar</button>
</div>

<div id="status"></div>
<div class="postsTitle">Mis publicaciones</div>
<div id="posts" class="posts"><div class="empty">Cargando publicaciones...</div></div>
</main>

<nav>
<a href="/index.html"><span>⌂</span>Inicio</a>
<a href="/explorar.html"><span>⌕</span>Explorar</a>
<a href="/crear.html"><span>＋</span>Crear</a>
<a href="/actividad.html"><span>♡</span>Actividad</a>
<a href="/perfil.html" class="active"><span>◉</span>Perfil</a>
</nav>

<script>
const SUPABASE_URL="https://axxafvggyetnnaumqefi.supabase.co";
const SUPABASE_KEY="sb_publishable_O4wRZft0LCo3DYiCWT4iqg_E5_c8B2A";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let currentUser=null;
let currentProfile=null;

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function showStatus(message){
 $("status").textContent=message;
}

async function uploadImage(file,folder){
 if(!file)return null;
 if(!file.type.startsWith("image/"))throw new Error("Seleccioná una imagen válida.");
 if(file.size>8*1024*1024)throw new Error("La imagen debe pesar menos de 8 MB.");

 const ext=file.name.split(".").pop().toLowerCase();
 const path=currentUser.id+"/"+folder+"-"+Date.now()+"."+ext;

 const {error}=await db.storage.from("og-media").upload(path,file,{
  upsert:false,
  contentType:file.type
 });
 if(error)throw error;

 return db.storage.from("og-media").getPublicUrl(path).data.publicUrl;
}

async function loadProfile(){
 const {data:auth,error:authError}=await db.auth.getUser();
 if(authError)throw authError;

 currentUser=auth.user;
 if(!currentUser){
  showStatus("Iniciá sesión desde la página principal.");
  $("editButton").disabled=true;
  $("logoutButton").disabled=true;
  $("posts").innerHTML='<div class="empty">Iniciá sesión para ver tu perfil.</div>';
  return;
 }

 const {data:profile,error}=await db.from("profiles")
  .select("*").eq("id",currentUser.id).maybeSingle();

 if(error)throw error;
 currentProfile=profile||{};

 $("name").textContent=currentProfile.full_name||currentProfile.username||"Usuario";
 $("username").textContent=currentProfile.username?"@"+currentProfile.username:"";
 $("bio").textContent=currentProfile.bio||"";
 $("avatar").src=currentProfile.avatar_url||"";
 $("cover").src=currentProfile.cover_url||"";
 $("cover").style.display=currentProfile.cover_url?"block":"none";

 $("editName").value=currentProfile.full_name||"";
 $("editUsername").value=currentProfile.username||"";
 $("editBio").value=currentProfile.bio||"";

 await loadCounts();
 await loadPosts();
}

async function loadCounts(){
 const [followers,following,posts]=await Promise.all([
  db.from("follows").select("*",{count:"exact",head:true}).eq("following_id",currentUser.id),
  db.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",currentUser.id),
  db.from("posts").select("*",{count:"exact",head:true}).eq("user_id",currentUser.id)
 ]);

 $("followers").textContent=followers.count??0;
 $("following").textContent=following.count??0;
 $("postCount").textContent=posts.count??0;
}

async function loadPosts(){
 const {data,error}=await db.from("posts")
  .select("*").eq("user_id",currentUser.id)
  .order("created_at",{ascending:false});

 if(error)throw error;

 if(!data?.length){
  $("posts").innerHTML='<div class="empty" style="grid-column:1/4">Todavía no publicaste nada.</div>';
  return;
 }

 $("posts").innerHTML=data.map(post=>{
  if(post.image_url){
   return `<div class="post"><img src="${escapeHTML(post.image_url)}" alt="Publicación"></div>`;
  }
  return `<div class="post postText">${escapeHTML(post.content||"")}</div>`;
 }).join("");
}

$("editButton").addEventListener("click",()=>{
 $("editPanel").style.display=$("editPanel").style.display==="block"?"none":"block";
});

$("cancelButton").addEventListener("click",()=>{
 $("editPanel").style.display="none";
});

$("saveButton").addEventListener("click",async()=>{
 if(!currentUser)return;

 const button=$("saveButton");
 button.disabled=true;
 showStatus("Guardando perfil...");

 try{
  const full_name=$("editName").value.trim();
  const username=$("editUsername").value.trim().replace(/^@/,"");
  const bio=$("editBio").value.trim();

  let avatar_url=currentProfile.avatar_url||null;
  let cover_url=currentProfile.cover_url||null;

  const avatarFile=$("editAvatar").files[0];
  const coverFile=$("editCover").files[0];

  if(avatarFile)avatar_url=await uploadImage(avatarFile,"avatar");
  if(coverFile)cover_url=await uploadImage(coverFile,"cover");

  const {error}=await db.from("profiles").upsert({
   id:currentUser.id,
   full_name,
   username,
   bio,
   avatar_url,
   cover_url
  },{onConflict:"id"});

  if(error)throw error;

  currentProfile={...currentProfile,full_name,username,bio,avatar_url,cover_url};

  $("name").textContent=full_name||username||"Usuario";
  $("username").textContent=username?"@"+username:"";
  $("bio").textContent=bio;
  $("avatar").src=avatar_url||"";
  $("cover").src=cover_url||"";
  $("cover").style.display=cover_url?"block":"none";

  $("editPanel").style.display="none";
  $("editAvatar").value="";
  $("editCover").value="";
  showStatus("¡Perfil actualizado!");
 }catch(error){
  console.error(error);
  showStatus("No se pudo guardar: "+error.message);
 }finally{
  button.disabled=false;
 }
});

$("logoutButton").addEventListener("click",async()=>{
 $("logoutButton").disabled=true;
 const {error}=await db.auth.signOut();
 if(error){
  showStatus("No se pudo cerrar sesión.");
  $("logoutButton").disabled=false;
  return;
 }
 location.href="/index.html";
});

loadProfile().catch(error=>{
 console.error(error);
 showStatus("Error al cargar el perfil: "+error.message);
});
</script>
</body>
</html>
