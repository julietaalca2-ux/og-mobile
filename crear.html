
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<title>Ög — Crear publicación</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090f;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:20px;border-bottom:1px solid #292933}
.logo{font-size:25px;font-weight:800}
main{max-width:600px;margin:auto;padding:22px 16px 110px}
h2{font-size:21px}
textarea{width:100%;min-height:140px;resize:vertical;background:#17171f;color:white;border:1px solid #30303a;border-radius:14px;padding:15px;font:15px inherit;outline:none}
textarea:focus{border-color:#9270ff}
.upload{display:block;margin-top:15px;padding:17px;border:1px dashed #686078;border-radius:14px;text-align:center;color:#c5b7e9;cursor:pointer}
input[type=file]{display:none}
#preview{width:100%;max-height:350px;object-fit:contain;border-radius:14px;margin-top:15px;display:none}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:13px;background:#8964e8;color:white;font-size:15px;font-weight:700}
button:disabled{opacity:.5}
#status{font-size:13px;color:#b9a4ed;margin-top:15px;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;background:#101017;border-top:1px solid #292933;display:flex;justify-content:space-around;padding:13px 5px calc(13px + env(safe-area-inset-bottom))}
nav a{color:#aaa;text-decoration:none;font-size:12px;text-align:center}
nav a.active{color:white}
nav span{display:block;font-size:21px;margin-bottom:4px}
</style>
</head>
<body>
<header><div class="logo">Ög</div></header>
<main>
<h2>Crear publicación</h2>
<textarea id="caption" placeholder="¿Qué estás pensando?"></textarea>

<label class="upload" for="photo">＋ Seleccionar una foto</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" alt="Vista previa">

<button id="publish">Publicar</button>
<div id="status"></div>
</main>

<nav>
<a href="/index.html"><span>⌂</span>Inicio</a>
<a href="/explorar.html"><span>⌕</span>Explorar</a>
<a href="/crear.html" class="active"><span>＋</span>Crear</a>
<a href="/actividad.html"><span>♡</span>Actividad</a>
<a href="/perfil.html"><span>◉</span>Perfil</a>
</nav>

<script>
const SUPABASE_URL="https://axxafvggyetnnaumqefi.supabase.co";
const SUPABASE_KEY="sb_publishable_O4wRZft0LCo3DYiCWT4iqg_E5_c8B2A";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const photo=document.getElementById("photo");
const preview=document.getElementById("preview");
const caption=document.getElementById("caption");
const button=document.getElementById("publish");
const status=document.getElementById("status");

let currentUser=null;

async function init(){
 const {data,error}=await db.auth.getUser();
 if(error||!data.user){
  status.textContent="Iniciá sesión para publicar.";
  button.disabled=true;
  return;
 }
 currentUser=data.user;
}

photo.addEventListener("change",()=>{
 const file=photo.files[0];
 if(!file)return;
 preview.src=URL.createObjectURL(file);
 preview.style.display="block";
});

button.addEventListener("click",async()=>{
 if(!currentUser){
  status.textContent="Iniciá sesión primero.";
  return;
 }

 const file=photo.files[0];
 const text=caption.value.trim();

 if(!text&&!file){
  status.textContent="Escribí algo o seleccioná una foto.";
  return;
 }

 button.disabled=true;
 status.textContent="Publicando...";

 try{
  let imageUrl=null;

  if(file){
   const ext=file.name.split(".").pop().toLowerCase();
   const path=currentUser.id+"/"+Date.now()+"."+ext;

   const {error:uploadError}=await db.storage
    .from("og-media")
    .upload(path,file,{upsert:false});

   if(uploadError)throw uploadError;

   const {data}=db.storage.from("og-media").getPublicUrl(path);
   imageUrl=data.publicUrl;
  }

  const {error}=await db.from("posts").insert({
   user_id:currentUser.id,
   content:text,
   image_url:imageUrl
  });

  if(error)throw error;

  status.textContent="¡Publicación creada!";
  caption.value="";
  photo.value="";
  preview.src="";
  preview.style.display="none";

  setTimeout(()=>location.href="/index.html",1000);

 }catch(error){
  console.error(error);
  status.textContent="No se pudo publicar: "+error.message;
 }finally{
  button.disabled=false;
 }
});

init();
</script>
</body>
</html>
