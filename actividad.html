
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<title>Ög — Actividad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090f;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:20px;border-bottom:1px solid #292933;background:#09090f}
.logo{font-size:25px;font-weight:800}
main{max-width:650px;margin:auto;padding:20px 16px 110px}
h2{font-size:21px;margin:5px 0 22px}
.activity{display:flex;align-items:center;gap:12px;padding:15px 3px;border-bottom:1px solid #24242d}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#292432;flex-shrink:0}
.activity-info{flex:1;min-width:0;font-size:14px;line-height:1.5;color:#fff;overflow-wrap:anywhere}
.activity-info strong{color:white}
.activity-info .activity-message{display:block;color:#fff;visibility:visible;opacity:1}
.time{display:block;font-size:12px;color:#92929e;margin-top:4px}
.empty{padding:35px 10px;text-align:center;color:#92929e;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#101017;border-top:1px solid #292933;display:flex;justify-content:space-around;padding:13px 5px calc(13px + env(safe-area-inset-bottom));z-index:10}
nav a{color:#aaa;text-decoration:none;font-size:12px;text-align:center}
nav a.active{color:white}
nav span{display:block;font-size:21px;margin-bottom:4px}
</style>
</head>
<body>
<header><div class="logo">Ög</div></header>

<main>
<h2>Actividad</h2>
<div id="activities"><div class="empty">Cargando actividad...</div></div>
</main>

<nav>
<a href="/index.html"><span>⌂</span>Inicio</a>
<a href="/explorar.html"><span>⌕</span>Explorar</a>
<a href="/crear.html"><span>＋</span>Crear</a>
<a href="/actividad.html" class="active"><span>♡</span>Actividad</a>
<a href="/perfil.html"><span>◉</span>Perfil</a>
</nav>

<script>
const SUPABASE_URL="https://axxafvggyetnnaumqefi.supabase.co";
const SUPABASE_KEY="sb_publishable_O4wRZft0LCo3DYiCWT4iqg_E5_c8B2A";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const container=document.getElementById("activities");

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function formatDate(value){
 const date=new Date(value);
 if(isNaN(date))return "";
 return date.toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"});
}

async function loadActivity(){
 container.innerHTML='<div class="empty">Cargando actividad...</div>';

 try{
  const {data:auth,error:authError}=await db.auth.getUser();
  if(authError)throw authError;

  const user=auth.user;
  if(!user){
   container.innerHTML='<div class="empty">Iniciá sesión para ver tu actividad.</div>';
   return;
  }

  const {data:myPosts,error:postsError}=await db
   .from("posts").select("id").eq("user_id",user.id);

  if(postsError)throw postsError;

  const postIds=(myPosts||[]).map(p=>p.id);
  let activities=[];

  const {data:follows,error:followsError}=await db
   .from("follows")
   .select("follower_id,created_at")
   .eq("following_id",user.id);

  if(followsError)throw followsError;

  (follows||[]).forEach(item=>{
   activities.push({
    actor:item.follower_id,
    type:"follow",
    date:item.created_at,
    post:null
   });
  });

  if(postIds.length){
   const {data:likes,error:likesError}=await db
    .from("likes")
    .select("user_id,post_id,created_at")
    .in("post_id",postIds);

   if(likesError)throw likesError;

   (likes||[]).forEach(item=>{
    activities.push({
     actor:item.user_id,
     type:"like",
     date:item.created_at,
     post:item.post_id
    });
   });

   const {data:comments,error:commentsError}=await db
    .from("comments")
    .select("user_id,post_id,content,created_at")
    .in("post_id",postIds);

   if(commentsError)throw commentsError;

   (comments||[]).forEach(item=>{
    activities.push({
     actor:item.user_id,
     type:"comment",
     date:item.created_at,
     post:item.post_id,
     content:item.content
    });
   });
  }

  activities=activities.filter(item=>item.actor&&item.actor!==user.id);
  activities.sort((a,b)=>new Date(b.date)-new Date(a.date));

  if(!activities.length){
   container.innerHTML='<div class="empty">Todavía no tenés actividad. Cuando alguien te siga, dé me gusta o comente, aparecerá acá.</div>';
   return;
  }

  const actorIds=[...new Set(activities.map(a=>a.actor))];

  const {data:profiles,error:profilesError}=await db
   .from("profiles")
   .select("id,username,full_name,avatar_url")
   .in("id",actorIds);

  if(profilesError)throw profilesError;

  const profileMap={};
  (profiles||[]).forEach(p=>profileMap[p.id]=p);

  container.innerHTML=activities.map(item=>{
   const profile=profileMap[item.actor]||{};
   const name=profile.full_name||profile.username||"Usuario";
   const username=profile.username?"@"+profile.username:"";
   const avatar=profile.avatar_url||"";

   let message="";
   if(item.type==="follow")message="comenzó a seguirte.";
   if(item.type==="like")message="le dio me gusta a tu publicación.";
   if(item.type==="comment")message="comentó tu publicación: "+(item.content||"");

   return `
    <div class="activity">
     <img class="avatar" src="${escapeHTML(avatar)}" alt=""
      onerror="this.style.display='none'">
     <div class="activity-info">
      <strong>${escapeHTML(name)}</strong>
      ${username?'<span> '+escapeHTML(username)+'</span>':""}
      <span class="activity-message">${escapeHTML(message)}</span>
      <span class="time">${escapeHTML(formatDate(item.date))}</span>
     </div>
    </div>`;
  }).join("");

 }catch(error){
  console.error(error);
  container.innerHTML='<div class="empty">No se pudo cargar la actividad. Revisá tu conexión e intentá nuevamente.</div>';
 }
}

loadActivity();
</script>
</body>
</html>
